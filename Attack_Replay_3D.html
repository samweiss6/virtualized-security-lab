  /* Layout: full-bleed centered WebGL scene + a single small color key (committed dark theme) */

(function(){
  "use strict";
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const canvas = document.getElementById("stage");
  const renderer = new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x060b16, 0.014);
  const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 200);
  const COL = { kali:0xff4d57, target:0xffb039, siem:0x39d4e6, grid:0x1b2c4a };

  // floor + isolation dome
  const grid = new THREE.GridHelper(60, 60, COL.grid, COL.grid);
  grid.material.transparent = true; grid.material.opacity = 0.55; scene.add(grid);
  const dome = new THREE.Mesh(
    new THREE.SphereGeometry(13, 24, 16, 0, Math.PI*2, 0, Math.PI*0.5),
    new THREE.MeshBasicMaterial({color:0x2a4a7a, wireframe:true, transparent:true, opacity:0.08}));
  scene.add(dome);

  // actors (image billboards)
  const texLoader = new THREE.TextureLoader();
  function billboard(uri, size, x, y, z){
    const map = texLoader.load(uri); map.minFilter = THREE.LinearFilter;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({map, transparent:true}));
    sp.scale.set(size,size,1); sp.position.set(x,y,z); scene.add(sp); return sp;
  }
  function pedestal(x,z,hex){
    const ring = new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,0.14,40), new THREE.MeshBasicMaterial({color:hex}));
    ring.position.set(x,0.07,z); scene.add(ring);
    const glow = new THREE.Mesh(new THREE.CylinderGeometry(1.9,1.9,0.02,40), new THREE.MeshBasicMaterial({color:hex,transparent:true,opacity:0.18}));
    glow.position.set(x,0.02,z); scene.add(glow);
    return {ring,glow};
  }
  const KALI_POS=new THREE.Vector3(-6,1.7,0), TGT_POS=new THREE.Vector3(6,1.7,0), EYE_POS=new THREE.Vector3(0,5.2,-4);
  const penguin=billboard(TEX.penguin,3.2,KALI_POS.x,KALI_POS.y,KALI_POS.z);
  const server =billboard(TEX.server,3.0,TGT_POS.x,TGT_POS.y,TGT_POS.z);
  const eye    =billboard(TEX.eye,3.0,EYE_POS.x,EYE_POS.y,EYE_POS.z);
  const pedK=pedestal(KALI_POS.x,KALI_POS.z,COL.kali);
  const pedT=pedestal(TGT_POS.x,TGT_POS.z,COL.target);

  // packet pool
  const POOL=260, pktGeo=new THREE.BoxGeometry(0.16,0.16,0.16), packets=[];
  for(let i=0;i<POOL;i++){ const m=new THREE.Mesh(pktGeo,new THREE.MeshBasicMaterial({color:COL.kali}));
    m.visible=false; scene.add(m);
    packets.push({mesh:m,active:false,t:0,spd:1,a:new THREE.Vector3(),b:new THREE.Vector3(),c:new THREE.Vector3()}); }
  const _v=new THREE.Vector3();
  function spawn(a,b,hex,spd,lift){
    for(let i=0;i<POOL;i++){ const p=packets[i]; if(p.active) continue;
      p.active=true; p.t=0; p.spd=spd; p.a.copy(a); p.b.copy(b);
      p.c.copy(a).add(b).multiplyScalar(0.5); p.c.y+=lift;
      p.mesh.material.color.setHex(hex); p.mesh.visible=true; return; }
  }
  function updatePackets(dt){
    for(let i=0;i<POOL;i++){ const p=packets[i]; if(!p.active) continue;
      p.t+=dt*p.spd; if(p.t>=1){ p.active=false; p.mesh.visible=false; continue; }
      const t=p.t,u=1-t;
      _v.copy(p.a).multiplyScalar(u*u).addScaledVector(p.c,2*u*t).addScaledVector(p.b,t*t);
      p.mesh.position.copy(_v); p.mesh.scale.setScalar(0.7+Math.sin(t*Math.PI)*0.9); }
  }

  // phase timeline (drives packet behaviour only — no text)
  const PH=[{end:3},{end:10},{end:17},{end:25}]; // intro, recon, exploit, detect
  const LOOP_START=3, LOOP_END=25;
  function phaseAt(t){ for(let i=0;i<PH.length;i++) if(t<PH[i].end) return i; return 3; }
  let clock=0, accAtk=0, accDet=0;
  const _tmp=new THREE.Vector3();
  function scatter(ph){
    if(ph===2) return _tmp.set(TGT_POS.x+(Math.random()-.5)*0.6,1.5+(Math.random()-.5)*0.6,(Math.random()-.5)*0.6).clone();
    return _tmp.set(TGT_POS.x+(Math.random()-.5)*1.0,0.4+Math.random()*3.2,(Math.random()-.5)*2.2).clone();
  }
  function emit(ph,dt){
    let atk=0,det=0;
    if(ph===1){atk=70;det=28;} else if(ph===2){atk=42;det=42;} else if(ph===3){atk=16;det=85;}
    if(reduce){atk*=0.5;det*=0.5;}
    accAtk+=atk*dt; accDet+=det*dt;
    while(accAtk>=1){ accAtk-=1; spawn(KALI_POS,scatter(ph),ph===2?COL.kali:COL.target,0.9+Math.random()*0.5,2.2+Math.random()*1.4); }
    while(accDet>=1){ accDet-=1;
      const from=new THREE.Vector3(TGT_POS.x-1-Math.random()*4,1.2+Math.random()*1.4,(Math.random()-.5)*2);
      spawn(from,EYE_POS,COL.siem,1.0+Math.random()*0.5,1.4+Math.random()*1.2); }
  }

  // drag to look (optional) — adds to the gentle front-facing sway
  let userAz=0, el=0.32, dragging=false, px=0, py=0;
  canvas.addEventListener("pointerdown",e=>{dragging=true;px=e.clientX;py=e.clientY;canvas.setPointerCapture(e.pointerId);});
  canvas.addEventListener("pointermove",e=>{ if(!dragging)return;
    userAz+=(e.clientX-px)*0.005; el+=(e.clientY-py)*0.004; el=Math.max(0.08,Math.min(0.9,el)); px=e.clientX;py=e.clientY;});
  canvas.addEventListener("pointerup",()=>dragging=false);
  canvas.addEventListener("pointercancel",()=>dragging=false);

  function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
  addEventListener("resize",resize); resize();

  let last=performance.now();
  function frame(now){
    const dt=Math.min(0.05,(now-last)/1000); last=now;
    clock+=dt; if(clock>=LOOP_END) clock=LOOP_START;
    const ph=phaseAt(clock);

    if(ph>=1) emit(ph,dt);
    updatePackets(dt);

    // exploit: target pedestal flashes red; detect: eye pulses
    const exploit=ph===2;
    const flash=exploit?(0.5+0.5*Math.sin(now*0.02)):0;
    pedT.ring.material.color.setHex(exploit?COL.kali:COL.target);
    pedT.glow.material.opacity=0.18+flash*0.5;
    server.scale.setScalar(3.0+(exploit?Math.sin(now*0.02)*0.08:0));
    const detect=ph===3;
    eye.scale.setScalar(3.0*(detect?1+Math.sin(now*0.01)*0.1:1));

    // CENTERED, near-level front view — auto-fit to the window; drag eases back to centre
    if(!dragging) userAz *= 0.90;
    const sway=userAz;
    const halfTan=Math.tan((camera.fov*Math.PI/180)/2);
    const SCENE_W=9.2, SCENE_H=4.4;                 // half-extents to keep in frame
    const fit=Math.max(SCENE_H/halfTan, SCENE_W/(halfTan*camera.aspect));
    const radius=Math.min(fit+3.5,28);
    camera.position.set(Math.sin(sway)*radius, 4.0, Math.cos(sway)*radius);
    camera.lookAt(0, 2.7, -1.2);

    renderer.render(scene,camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
